name: Test Docker Compose

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create env files
        run: |
          cp .env.example .env
          cp frontend/.env.example frontend/.env
      - name: Check production services and ports
        env:
          BACKEND_IMAGE_TAG: ci-validation
        run: |
          services=$(docker compose -f compose.yml -f compose.deploy.yml config --services | sort)
          test "$services" = "$(printf '%s\n' backend db)"
          docker compose -f compose.yml -f compose.deploy.yml config --format json | jq -e '
            [.services | to_entries[] | .key as $service | .value.ports[]?
              | [$service, .published, .target, .protocol]] == [["backend", "80", 8000, "tcp"]]
          ' > /dev/null
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: |
          response=$(curl -fsS http://localhost:8000/api/v1/utils/health-check/)
          test "$response" = true
      - name: Test frontend is up
        run: test "$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 200
      - run: docker compose down -v --remove-orphans
