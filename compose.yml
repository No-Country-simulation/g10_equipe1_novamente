services:

  db:
    image: pgvector/pgvector:0.8.7-pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      OCI_BUCKET: ${OCI_BUCKET:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_AUTH: ${OCI_AUTH:-}
      OCI_CONFIG_FILE: ${OCI_CONFIG_FILE:-}
      OCI_CONFIG_PROFILE: ${OCI_CONFIG_PROFILE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-}
      GEMINI_EMBEDDING_RPM: ${GEMINI_EMBEDDING_RPM:-}
      GEMINI_EMBEDDING_TPM: ${GEMINI_EMBEDDING_TPM:-}
      GEMINI_GENERATION_RPM: ${GEMINI_GENERATION_RPM:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
volumes:
  app-db-data:
