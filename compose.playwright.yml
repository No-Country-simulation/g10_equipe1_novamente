services:
  backend:
    volumes:
      - ./backend/tests/playwright_app.py:/app/backend/tests/playwright_app.py:ro
    command:
      - uvicorn
      - --app-dir
      - /app/backend/tests
      - playwright_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
